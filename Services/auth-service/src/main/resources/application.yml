spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/marketplacex
    username: marketplacex
    password: password
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC';
      data-source-properties:
        stringtype: unspecified

    jackson:
      time-zone: UTC

  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        ddl-auto: none
        boot:
          allow_jdbc_metadata_access: false
        database-platform: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: never

server:
  port: 8081

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.engine.jdbc.env.internal.JdbcEnvironmentInitiator: TRACE