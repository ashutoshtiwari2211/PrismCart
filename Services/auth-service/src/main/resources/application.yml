spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/marketplacex
    username: marketplacex
    password: password
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        stringtype: unspecified

  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        boot:
          allow_jdbc_metadata_access: false
        database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernates:
      ddl-auto: update


security:
  jwt:
    secret: q83wZk6nYw3uT4jvO8sC6l7h9wF5x2a1mB3dR8nQ0xY=   # put a base64-encoded 256-bit key in env var
    expiration-ms: 86400000        # 1 day


server:
  port: 8081


logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.engine.jdbc.env.internal.JdbcEnvironmentInitiator: TRACE